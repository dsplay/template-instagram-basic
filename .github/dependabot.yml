version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Pinned versions: Dependabot bumps the exact version in package.json.
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
