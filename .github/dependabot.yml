version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Pinned versions: Dependabot bumps the exact version in package.json.
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    # archiver 8.x is a from-scratch ESM-only rewrite with a totally different (class-based,
    # no default export) API than the 7.x we actually integrated against (see AGENTS.md) —
    # there's no CI here to catch that breakage before a merge, so block the major bump
    # instead of relying on someone remembering to test npm run zip by hand.
    ignore:
      - dependency-name: "archiver"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
